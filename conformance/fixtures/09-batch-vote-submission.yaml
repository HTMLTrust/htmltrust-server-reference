# 09 — Vote submission and aggregate stats
#
# Votes move a key's trust score, so the voter is derived from the
# authenticated request rather than from a `userId` field in the body. A
# caller holding only the shared submission key has no distinguishable
# identity, so every such caller is one voter: repeated submissions replace
# that voter's ballot instead of stacking. Distinct voters need distinct
# identities, which means an RFC 9421 signature from a resolvable key.
#
# This fixture pins that behaviour — before it, naming a different `userId`
# per request let a single key manufacture unlimited votes against a target.
name: Vote submission is bound to the caller's identity
description: |
  POSTs several votes against one target from a single authenticated caller
  and asserts the stats endpoint counts one ballot, not one per body-supplied
  user id.
steps:
  - name: Create author
    request:
      method: POST
      path: /authors
      headers:
        X-API-KEY: $generalApiKey
      body:
        name: "Batch 09-$run_nonce"
        keyType: "ORGANIZATION"
    expect:
      status: 201
    capture:
      authorId: $.author.id

  - name: First vote (TRUST)
    request:
      method: POST
      path: /votes
      headers:
        X-API-KEY: $generalApiKey
      body:
        userId: "batch-09-$run_nonce-1"
        targetType: "AUTHOR"
        targetId: $authorId
        voteType: "TRUST"
    expect: { status: 201 }

  - name: Aggregate stats after one vote
    request:
      method: GET
      path: /votes/stats/AUTHOR/$authorId
    expect:
      status: 200
      body:
        trustCount: 1
        distrustCount: 0
        totalVotes: 1

  - name: A second vote naming a different userId does not create a second ballot
    request:
      method: POST
      path: /votes
      headers:
        X-API-KEY: $generalApiKey
      body:
        userId: "batch-09-$run_nonce-2"
        targetType: "AUTHOR"
        targetId: $authorId
        voteType: "TRUST"
    expect: { status: 201 }

  - name: Changing the vote type replaces the caller's ballot
    request:
      method: POST
      path: /votes
      headers:
        X-API-KEY: $generalApiKey
      body:
        userId: "batch-09-$run_nonce-3"
        targetType: "AUTHOR"
        targetId: $authorId
        voteType: "DISTRUST"
    expect: { status: 201 }

  - name: Confirm the caller still holds exactly one ballot
    request:
      method: GET
      path: /votes/stats/AUTHOR/$authorId
    expect:
      status: 200
      body:
        trustCount: 0
        distrustCount: 1
        totalVotes: 1
