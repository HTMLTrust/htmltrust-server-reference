# 05 — Structured endorsement submission
#
# Draft §9.7: the directory MUST verify the endorser's signature before
# indexing an endorsement, and MUST reject an invalid one with 400. The happy
# path therefore registers a public key whose private half the runner holds
# and signs the document for real; the negative cases prove that a forged
# signature and an unresolvable endorser are both refused.
#
# Draft §9.5/§10.1: the stored document is served back verbatim, so the
# response body carries no server-assigned `_id`. The identifier comes from
# the Location header.
name: Submit structured endorsement document
description: |
  POST /endorsements verifies the endorser signature over JCS(document minus
  signature) and stores the document unmodified.
steps:
  - name: Register the endorser's public key
    request:
      method: POST
      path: /authors
      headers:
        X-API-KEY: $generalApiKey
      body:
        name: "Endorser 05-$run_nonce"
        keyType: "ORGANIZATION"
        keyAlgorithm: "ed25519"
        publicKey: $signerPublicKeyPem
    expect:
      status: 201
    capture:
      authorId: $.author.id

  - name: Learn the directory key id for that public key
    request:
      method: GET
      path: /authors/$authorId/public-key
    expect:
      status: 200
      schema: PublicKey
    capture:
      keyId: $.id

  - name: Submit a correctly signed endorsement
    request:
      method: POST
      path: /endorsements
      headers:
        X-API-KEY: $generalApiKey
      sign: endorsement
      body:
        endorser: "$baseUrl/keys/$keyId"
        endorsement: "sha256:jPC/zIv0U/yOO0s9kY2U86pa9xudR17/niqrNOk0Puk"
        algorithm: "ed25519"
        timestamp: "2026-05-10T09:00:00Z"
        claim: "Verified original publication."
    expect:
      status: 201
      schema: Endorsement
      body:
        endorser: "$baseUrl/keys/$keyId"
        endorsement: "sha256:jPC/zIv0U/yOO0s9kY2U86pa9xudR17/niqrNOk0Puk"
        algorithm: "ed25519"
        claim: "Verified original publication."
    capture:
      endorsementId:
        header: location
        pattern: "([0-9a-f]{24})$"

  - name: Resubmitting the identical document is idempotent
    request:
      method: POST
      path: /endorsements
      headers:
        X-API-KEY: $generalApiKey
      sign: endorsement
      body:
        endorser: "$baseUrl/keys/$keyId"
        endorsement: "sha256:jPC/zIv0U/yOO0s9kY2U86pa9xudR17/niqrNOk0Puk"
        algorithm: "ed25519"
        timestamp: "2026-05-10T09:00:00Z"
        claim: "Verified original publication."
    expect:
      status: 200

  - name: A forged signature is rejected with a problem document
    request:
      method: POST
      path: /endorsements
      headers:
        X-API-KEY: $generalApiKey
      body:
        endorser: "$baseUrl/keys/$keyId"
        endorsement: "sha256:jPC/zIv0U/yOO0s9kY2U86pa9xudR17/niqrNOk0Puk"
        algorithm: "ed25519"
        timestamp: "2026-05-10T09:00:00Z"
        signature: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
    expect:
      status: 400
      schema: Problem
      body:
        status: 400

  - name: An endorser this directory cannot resolve is rejected
    request:
      method: POST
      path: /endorsements
      headers:
        X-API-KEY: $generalApiKey
      sign: endorsement
      body:
        endorser: "did:web:reviewer.example"
        endorsement: "sha256:jPC/zIv0U/yOO0s9kY2U86pa9xudR17/niqrNOk0Puk"
        algorithm: "ed25519"
        timestamp: "2026-05-10T09:00:00Z"
    expect:
      status: 400
      schema: Problem

  - name: Deleting an endorsement requires more than the submission key
    request:
      method: DELETE
      path: /endorsements/$endorsementId
      headers:
        X-API-KEY: $generalApiKey
    expect:
      status: 401
      schema: Problem

  - name: The directory operator can take an endorsement down
    request:
      method: DELETE
      path: /endorsements/$endorsementId
      headers:
        X-ADMIN-API-KEY: $adminApiKey
    expect:
      status: 204
