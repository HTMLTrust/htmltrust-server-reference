          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /content/sign:
    post:
      tags:
        - Content
      summary: Sign content
      description: |
        Compatibility signing helper. The client submits already-computed
        `contentHash` and `claimsHash` values; the server signs the draft
        payload `contentHash:claimsHash:domain:signedAt`. `claimsHash` is the
        hash of all direct child `meta` claims, including `signed-at`.
      operationId: signContent
      security:
        - AuthorApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contentHash
                - claimsHash
                - domain
                - signedAt
                - claims
              properties:
                contentHash:
                  type: string
                  description: Hash of the normalized content using canonical unpadded standard Base64
                claimsHash:
                  type: string
                  description: Hash of all direct child meta claims using canonical unpadded standard Base64
                domain:
                  type: string
                  description: Serialized Web origin associated with the content, not a bare hostname
                signedAt:
                  type: string
                  format: date-time
                  description: UTC RFC3339 timestamp from the direct child signed-at claim
                claims:
                  type: object
                  description: Direct child meta claims about the content; every such claim participates in claimsHash.
                  additionalProperties: true
      responses:
        "201":
          description: Content signed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSignature"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /content/verify:
    post:
      tags:
        - Content
      summary: Verify content signature (DEPRECATED)
      description: |
        DEPRECATED: cryptographic verification is a local operation per
        HTMLTrust spec §3.1. This endpoint is retained as a low-trust
        convenience and will be removed in a future major version. Clients
        MUST verify signatures locally (e.g. via SubtleCrypto). Responses
        include the `Deprecation: true` header per RFC 9745.
      deprecated: true
      operationId: verifyContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contentHash
                - claimsHash
                - domain
                - signedAt
                - authorId
                - signature
              properties:
                contentHash:
                  type: string
                  description: Hash of the normalized content using canonical unpadded standard Base64
                claimsHash:
                  type: string
                  description: Hash of all direct child meta claims
                domain:
                  type: string
                  description: Serialized Web origin associated with the content, not a bare hostname
                signedAt:
                  type: string
                  format: date-time
                authorId:
                  type: string
                  format: uuid
                  description: ID of the author who signed the content
                signature:
                  type: string
                  description: Cryptographic signature to verify
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                required:
                  - valid
                properties:
                  valid:
                    type: boolean
                    description: Whether the signature is valid
                  author:
                    $ref: "#/components/schemas/Author"
                  claims:
                    type: object
                    description: Claims included in the signature
                    additionalProperties: true
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /claims:
    post:
      tags:
        - Claims
      summary: Create a new claim type
      description: Creates a new claim type definition
      operationId: createClaimType
      security:
        - AdminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
              properties:
                name:
                  type: string
                  description: Name of the claim type
                description:
                  type: string
                  description: Description of what this claim type represents
                possibleValues:
                  type: array
                  description: Possible values for this claim type (if applicable)
                  items:
                    type: string
      responses:
        "201":
          description: Claim type created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      tags:
        - Claims
      summary: List claim types
      description: Returns a list of claim types
      operationId: listClaimTypes
      parameters:
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: List of claim types
          content:
            application/json:
              schema:
                type: object
                properties:
                  claims:
                    type: array
                    items:
                      $ref: "#/components/schemas/Claim"
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      pages:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer

  /claims/{claimId}:
