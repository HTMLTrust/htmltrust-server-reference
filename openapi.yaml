  /content/sign:
    post:
      tags:
        - Content
      summary: Sign content
      description: |
        Author-authenticated convenience signer for the frozen
        `htmltrust-signature-v1` profile. The directory selects the
        authenticated author's directory-held key, derives `location` from
        the final HTTPS `sourceURL` and `scope`, computes `claimsHash` from
        the strict v1 claims array, and signs the RFC 8785 JSON payload. The
        caller must not submit `claimsHash` or the legacy `domain` field.
      operationId: signContent
      security:
        - AuthorApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contentHash
                - sourceURL
                - scope
                - signedAt
                - claims
              properties:
                contentHash:
                  type: string
                  description: Hash of the normalized content using canonical unpadded standard Base64
                sourceURL:
                  type: string
                  format: uri
                  description: Final HTTPS response URL where the signed section will be published
                scope:
                  type: string
                  enum: [url, origin]
                  description: Location binding scope used to derive the signed location
                signedAt:
                  type: string
                  description: Exact UTC timestamp in YYYY-MM-DDTHH:MM:SSZ form, also present in claims
                claims:
                  type: array
                  description: Strict v1 claim records. Include exactly one signed-at record.
                  items:
                    type: object
                    required: [name, content]
                    additionalProperties: false
                    properties:
                      name: { type: string }
                      content: { type: string }
      responses:
        "201":
          description: Content signed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V1ContentSignature"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No active directory-held signing key exists for the author
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /content/verify:
    post:
      tags:
        - Content
      summary: Verify content signature (DEPRECATED)
      description: |
        DEPRECATED: cryptographic verification is a local operation per
        HTMLTrust spec §3.1. This endpoint is retained as a low-trust
        convenience and will be removed in a future major version. Clients
        MUST verify signatures locally (e.g. via SubtleCrypto). Responses
        include the `Deprecation: true` header per RFC 9745.
      deprecated: true
      operationId: verifyContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contentHash
                - claimsHash
                - domain
                - signedAt
                - authorId
                - signature
              properties:
                contentHash:
                  type: string
                  description: Hash of the normalized content using canonical unpadded standard Base64
                claimsHash:
                  type: string
                  description: Hash of all direct child meta claims
                domain:
                  type: string
                  description: Serialized Web origin associated with the content; bare hostnames are invalid
                signedAt:
                  type: string
                  format: date-time
                authorId:
                  type: string
                  format: uuid
                  description: ID of the author who signed the content
                signature:
                  type: string
                  description: Cryptographic signature to verify
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                required:
                  - valid
                properties:
                  valid:
                    type: boolean
                    description: Whether the signature is valid
                  author:
                    $ref: "#/components/schemas/Author"
                  claims:
                    type: object
                    description: Claims included in the signature
                    additionalProperties: true
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

