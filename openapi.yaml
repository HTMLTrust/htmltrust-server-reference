        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /directory/content:
    get:
      tags:
        - Directory
      summary: Search signed content
      description: Searches for signed content in the directory
