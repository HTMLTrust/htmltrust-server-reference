              schema:
                $ref: "#/components/schemas/Error"

  /directory/content/report:
    post:
      tags:
        - Directory
      summary: Report content misuse
      description: Reports content for misuse, theft, or other issues
      operationId: reportContentMisuse
      security:
        - GeneralApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contentHash
                - sourceUrl
                - targetUrl
                - reason
              properties:
                contentHash:
                  type: string
                  description: Hash of the content being reported
                sourceUrl:
                  type: string
                  format: uri
                  description: Original source URL of the content
                targetUrl:
                  type: string
                  format: uri
                  description: URL where the content is being misused
                reason:
                  type: string
                  enum:
                    [
                      COPYRIGHT_VIOLATION,
                      UNAUTHORIZED_USE,
                      IMPERSONATION,
                      OTHER,
                    ]
                  description: Reason for reporting
                details:
                  type: string
                  description: Additional details about the report
      responses:
        "201":
          description: Report submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  reportId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [PENDING, UNDER_REVIEW, ACCEPTED, REJECTED]
                    default: PENDING
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Content hash not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /endorsements:
    get:
      tags:
        - Endorsements
      summary: List endorsements for a content hash
      description: |
        Returns all endorsements on file for a given content hash. The
        directory is a passive store; clients MUST verify each endorsement's
        signature locally using the endorser's public key (per spec §2.5)
        before treating it as trustworthy. Unverified endorsements MUST NOT
        contribute to any trust decision.
      operationId: listEndorsements
      parameters:
        - name: content-hash
          in: query
          required: true
          description: The content hash to look up endorsements for (e.g. "sha256:...")
          schema:
            type: string
      responses:
        "200":
          description: Array of endorsements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Endorsement"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Endorsements
      summary: Submit a signed endorsement for storage
      description: |
        Stores a structured endorsement document. The signed payload is the
        JSON canonicalization of the endorsement document with `signature`
        omitted. The legacy `contentHash` field is accepted as an alias for
        the draft `endorsement` field.
      operationId: createEndorsement
      security:
        - HttpMessageSignature: []
        - GeneralApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - endorser
                - endorsement
                - algorithm
                - signature
                - timestamp
              properties:
                endorser:
                  type: string
                  description: Opaque endorser keyid (e.g. "did:web:publisher.org")
                endorsement:
                  type: string
                  description: Draft field for the targeted content hash (e.g. "sha256:...")
                contentHash:
                  type: string
                  description: Legacy alias for endorsement
                signature:
                  type: string
                  description: Canonical unpadded standard Base64 signature over JCS(document with signature omitted)
                timestamp:
                  type: string
                  description: ISO-8601 timestamp at which the endorsement was issued
                algorithm:
                  type: string
                  description: Signature algorithm (default ed25519)
                  default: ed25519
                rawBlob:
                  type: string
                  description: |
                    The exact bytes the client signed over. Clients SHOULD
                    supply this so verifiers can re-verify byte-identically.
                    If omitted, the server constructs a canonical blob in a
                    stable key order.
      responses:
        "201":
          description: Endorsement stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endorsement"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /endorsements/{id}:
    delete:
      tags:
        - Endorsements
      summary: Delete an endorsement
      description: |
        Removes an endorsement from the directory. MVP: gated behind the
        general API key only. Production deployments MUST additionally
        require that the caller's authenticated identity match the
        endorsement's `endorser` keyid.
      operationId: deleteEndorsement
      security:
        - HttpMessageSignature: []
        - AdminApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Endorsement deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Endorsement not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
