# 03 — Signed content submission
#
# Prerequisite: create an author so we have an author-scoped API key.
# Then sign a content hash. The signature itself is server-generated;
# the convenience endpoint emits the complete frozen v1 signed-section
# attribute set.
name: Sign content with author key
description: |
  POST /content/sign produces a v1 signed-section record bound to the
  author's directory-held key and the final HTTPS source URL.
steps:
  - name: Create author (signing identity)
    request:
      method: POST
      path: /authors
      headers:
        X-API-KEY: $generalApiKey
      body:
        name: "Signer 03-$run_nonce"
        keyType: "HUMAN"
        keyAlgorithm: "ED25519"
    expect:
      status: 201
    capture:
      authorId: $.author.id
      authorApiKey: $.authorApiKey

  - name: Sign content
    request:
      method: POST
      path: /content/sign
      headers:
        X-AUTHOR-API-KEY: $authorApiKey
      body:
        contentHash: "sha256:xJTJYuXl1MuP1EjRLhKtgMUZvvc6qexrTMHyVnVL+Yc"
        sourceURL: "https://conformance.example.com/articles/03#summary"
        scope: "url"
        signedAt: "2026-05-12T12:00:00Z"
        claims:
          - name: "signed-at"
            content: "2026-05-12T12:00:00Z"
          - name: "claim:ContentType"
            content: "Article"
          - name: "claim:License"
            content: "CC-BY-4.0"
    expect:
      status: 201
      schema: V1ContentSignature
      body:
        contentHash: "sha256:xJTJYuXl1MuP1EjRLhKtgMUZvvc6qexrTMHyVnVL+Yc"
        profile: "htmltrust-signature-v1"
        scope: "url"
        location: "https://conformance.example.com/articles/03"
        sourceURL: "https://conformance.example.com/articles/03#summary"
        signature: $nonempty-string
        algorithm: "ed25519"
        keyid: $nonempty-string
        claims: $any
